[build]
command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && APP_BASE_PATH=/dispatch VITE_APP_BASE_PATH=/dispatch NITRO_PRESET=netlify pnpm --filter dispatch build"
publish = "apps/dispatch/dist"
functions = "apps/dispatch/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
  NITRO_PRESET = "netlify"
  NPM_CONFIG_PRODUCTION = "false"

# A2A delegation calls run a full agent loop (LLM + tool calls + DB queries).
# The framework does not impose a default agent-run timeout; if a template sets
# AGENT_RUN_SOFT_TIMEOUT_MS, keep it below this function timeout so the hidden
# auto-continuation path can hand off before Netlify kills the function.
  APP_BASE_PATH = "/dispatch"
  VITE_APP_BASE_PATH = "/dispatch"
[functions."*"]
timeout = 75

[[redirects]]
  from = "/"
  to = "/dispatch/overview"
  status = 302

