[build]
command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && APP_BASE_PATH=/qualify VITE_APP_BASE_PATH=/qualify NITRO_PRESET=netlify pnpm --filter qualify build"
publish = "apps/qualify/dist"
functions = "apps/qualify/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
  NITRO_PRESET = "netlify"
  NPM_CONFIG_PRODUCTION = "false"

  APP_BASE_PATH = "/qualify"
  VITE_APP_BASE_PATH = "/qualify"