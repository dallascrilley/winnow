[build]
command = "export DATABASE_URL=\"${NETLIFY_DATABASE_URL:-$DATABASE_URL}\" && DATABASE_URL=\"${NETLIFY_DATABASE_URL_UNPOOLED:-$DATABASE_URL}\" APP_BASE_PATH=/forms VITE_APP_BASE_PATH=/forms NITRO_PRESET=netlify pnpm --filter forms build"
publish = "apps/forms/dist"
functions = "apps/forms/.netlify/functions-internal"

[build.environment]
GA_MEASUREMENT_ID = "G-ESF7FYXGN9"
  NITRO_PRESET = "netlify"
  NPM_CONFIG_PRODUCTION = "false"

# A2A delegation calls run a full agent loop (LLM + tool calls + DB queries).
# The framework does not impose a default agent-run timeout; if a template sets
# AGENT_RUN_SOFT_TIMEOUT_MS, keep it below this function timeout so the hidden
# auto-continuation path can hand off before Netlify kills the function.
  APP_BASE_PATH = "/forms"
  VITE_APP_BASE_PATH = "/forms"
[functions."*"]
timeout = 75
